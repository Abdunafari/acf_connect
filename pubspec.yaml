name: acf_connect
description: "ACF Connect (Abba Continuity Forum) - Political mobilization and communication app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  # Local Database (Offline First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Real-Time Communication
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.0

  # Encryption
  encrypt: ^5.0.3

  # Maps
  google_maps_flutter: ^2.5.3

  # Localization
  easy_localization: ^3.0.3

  # UI/UX
  flutter_screenutil: ^5.9.0
  pinput: ^4.0.0
  flutter_rating_bar: ^4.0.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  record: ^5.0.4
  audioplayers: ^5.2.1
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
